<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="sql-spider">
  <title>sql-spider</title>
  <desc>A closed dependency web: an amber seed node connected to a ring of nodes, one connected component.</desc>
  <g stroke="#8b949e" stroke-width="2.2">
    <line x1="50" y1="50" x2="50" y2="18"/><line x1="50" y1="50" x2="78" y2="34"/><line x1="50" y1="50" x2="78" y2="66"/>
    <line x1="50" y1="50" x2="50" y2="82"/><line x1="50" y1="50" x2="22" y2="66"/><line x1="50" y1="50" x2="22" y2="34"/>
    <line x1="50" y1="18" x2="78" y2="34"/><line x1="78" y1="34" x2="78" y2="66"/><line x1="78" y1="66" x2="50" y2="82"/>
    <line x1="50" y1="82" x2="22" y2="66"/><line x1="22" y1="66" x2="22" y2="34"/><line x1="22" y1="34" x2="50" y2="18"/>
  </g>
  <g fill="#8b949e">
    <circle cx="50" cy="18" r="6"/><circle cx="78" cy="34" r="6"/><circle cx="78" cy="66" r="6"/>
    <circle cx="50" cy="82" r="6"/><circle cx="22" cy="66" r="6"/><circle cx="22" cy="34" r="6"/>
  </g>
  <circle cx="50" cy="50" r="9" fill="#d29922"/>
</svg>
